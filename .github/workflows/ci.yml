name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Test platform-neutral projects
        run: dotnet test tests/Aperture.Core.Tests/Aperture.Core.Tests.csproj -c Release

  windows-app:
    name: Build Windows app (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build WinUI app
        run: dotnet build src/Aperture.App/Aperture.App.csproj -c Release -p:Platform=${{ matrix.platform }}
      - name: Launch smoke test
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $exe = "src/Aperture.App/bin/x64/Release/net10.0-windows10.0.22621.0/win-x64/Aperture.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          $p.Refresh()
          if ($p.HasExited) { throw "Aperture exited during startup with code $($p.ExitCode)" }
          if ($p.MainWindowHandle -eq 0) { Stop-Process -Id $p.Id -Force; throw "Aperture is running but has no main window" }
          Write-Host "Aperture started and opened its window: '$($p.MainWindowTitle)'"
          Stop-Process -Id $p.Id -Force
