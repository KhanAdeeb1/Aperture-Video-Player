name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-tests:
    name: Core, data and library tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The media server's conversion tests use FFmpeg (they are reported as skipped without it).
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Test platform-neutral projects
        run: |
          dotnet test tests/Aperture.Core.Tests/Aperture.Core.Tests.csproj -c Release
          dotnet test tests/Aperture.Data.Tests/Aperture.Data.Tests.csproj -c Release
          dotnet test tests/Aperture.Media.Tests/Aperture.Media.Tests.csproj -c Release
          dotnet test tests/Aperture.YouTube.Tests/Aperture.YouTube.Tests.csproj -c Release
          dotnet test tests/Aperture.Server.Tests/Aperture.Server.Tests.csproj -c Release --logger "console;verbosity=normal"

  test-media:
    name: Generate test media
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Generate visual-review clips
        run: tools/visual-review/make-test-media.sh "$RUNNER_TEMP/test-media"
      - name: Generate engine test files
        run: tools/test-media/make-engine-test-media.sh "$RUNNER_TEMP/engine-media"
      - uses: actions/upload-artifact@v4
        with:
          name: test-media
          path: ${{ runner.temp }}/test-media
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: engine-media
          path: ${{ runner.temp }}/engine-media
          include-hidden-files: true
          retention-days: 3

  engine-tests:
    name: libmpv engine tests (${{ matrix.os }})
    needs: test-media
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install libmpv (Ubuntu package)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libmpv2
      - name: Fetch the pinned libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: tools/Get-Libmpv.ps1 -RuntimeIdentifier win-x64
      - uses: actions/download-artifact@v4
        with:
          name: engine-media
          path: ${{ runner.temp }}/engine-media
      - name: Play every representative file through libmpv
        shell: bash
        env:
          APERTURE_TEST_MEDIA: ${{ runner.temp }}/engine-media
          APERTURE_TEST_RESULTS: ${{ runner.temp }}/engine-results.md
        run: |
          dotnet test tests/Aperture.Playback.Mpv.Tests/Aperture.Playback.Mpv.Tests.csproj -c Release --blame-hang-timeout 3m --logger "console;verbosity=normal"
      - name: Publish measured results
        if: always()
        shell: bash
        run: |
          {
            echo "### Representative files on ${{ matrix.os }}"
            echo
            echo "| File | Result | Details |"
            echo "|---|---|---|"
            sort -u "$RUNNER_TEMP/engine-results.md" 2>/dev/null || echo "| (no results) | | |"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  windows-app:
    name: Build Windows app (${{ matrix.platform }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build WinUI app (fetches the pinned libmpv)
        run: dotnet build src/Aperture.App/Aperture.App.csproj -c Release -p:Platform=${{ matrix.platform }}
      - name: Check the native libraries are next to the app
        shell: pwsh
        run: |
          $rid = if ('${{ matrix.platform }}' -eq 'x64') { 'win-x64' } else { 'win-arm64' }
          $dir = "src/Aperture.App/bin/${{ matrix.platform }}/Release/net10.0-windows10.0.22621.0/$rid"
          foreach ($dll in 'libmpv-2.dll', 'av_libglesv2.dll', 'Server/Aperture.Server.exe', 'Server/wwwroot/app.js') {
            if (-not (Test-Path (Join-Path $dir $dll))) { throw "$dll is missing from $dir" }
            Write-Host "$dll present ($((Get-Item (Join-Path $dir $dll)).Length) bytes)"
          }
      - name: Media server starts and stops on its own
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $server = "src/Aperture.App/bin/x64/Release/net10.0-windows10.0.22621.0/win-x64/Server/Aperture.Server.exe"
          $env:APERTURE_DATA_DIR = Join-Path $env:RUNNER_TEMP "aperture-server-smoke"
          $p = Start-Process -FilePath $server -ArgumentList 'run', '--background' -PassThru -WindowStyle Hidden
          $deadline = (Get-Date).AddSeconds(30)
          do { Start-Sleep -Seconds 1; & $server status | Out-Null } until ($LASTEXITCODE -eq 0 -or $p.HasExited -or (Get-Date) -gt $deadline)
          & $server status
          if ($LASTEXITCODE -ne 0) { Get-Content (Join-Path $env:APERTURE_DATA_DIR 'Logs/server.log') -ErrorAction SilentlyContinue; throw "the media server did not start (exit $($p.ExitCode))" }
          & $server stop
          if (-not $p.WaitForExit(20000)) { throw 'the media server did not stop' }
          Write-Host "Stopped with exit code $($p.ExitCode)"
          Get-Content (Join-Path $env:APERTURE_DATA_DIR 'Logs/server.log')
      - name: Launch smoke test
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $exe = "src/Aperture.App/bin/x64/Release/net10.0-windows10.0.22621.0/win-x64/Aperture.exe"
          $env:APERTURE_DATA_DIR = Join-Path $env:RUNNER_TEMP "aperture-smoke"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          $p.Refresh()
          $log = Join-Path $env:APERTURE_DATA_DIR "Logs/aperture.log"
          if ($p.HasExited) {
            if (Test-Path $log) { Get-Content $log }
            Get-WinEvent -LogName Application -MaxEvents 10 -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error' } |
              ForEach-Object { $_.Message }
            throw "Aperture exited during startup with code $($p.ExitCode)"
          }
          if ($p.MainWindowHandle -eq 0) { Stop-Process -Id $p.Id -Force; throw "Aperture is running but has no main window" }
          Write-Host "Aperture started and opened its window: '$($p.MainWindowTitle)'"
          Stop-Process -Id $p.Id -Force
          if (Test-Path $log) { Get-Content $log }

  release-package:
    name: Release package (${{ matrix.platform }})
    needs: test-media
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Install Inno Setup if the runner lacks it
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the installer and portable zip
        shell: pwsh
        run: tools/Build-Release.ps1 -Platform ${{ matrix.platform }} -OutDir "$env:RUNNER_TEMP/release"
      # An "older version" built from the same files, so the upgrade path can be exercised.
      - name: Build a stand-in older installer
        if: matrix.platform == 'x64'
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc /Qp /DAppVersion=0.0.9 /DPlatform=x64 "/DSourceDir=$env:RUNNER_TEMP\release\publish-win-x64" "/DOutputDir=$env:RUNNER_TEMP\older" installer/Aperture.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)" }
      - uses: actions/download-artifact@v4
        if: matrix.platform == 'x64'
        with:
          name: test-media
          path: ${{ runner.temp }}/test-media
      - name: Install, upgrade and uninstall
        if: matrix.platform == 'x64'
        shell: pwsh
        run: >
          tools/release/Test-Install.ps1
          -OldSetup "$env:RUNNER_TEMP/older/Aperture-0.0.9-x64-setup.exe"
          -NewSetup (Get-ChildItem "$env:RUNNER_TEMP/release/Aperture-*-x64-setup.exe").FullName
          -Video "$env:RUNNER_TEMP/test-media/Night Market.mkv"
      - name: Open and close 20 times, then play for 10 minutes
        if: matrix.platform == 'x64'
        shell: powershell
        run: >
          tools/release/Test-Soak.ps1
          -Exe "$env:RUNNER_TEMP/release/publish-win-x64/Aperture.exe"
          -Video "$env:RUNNER_TEMP/test-media/Harbour Lights.mp4"
          -OutDir "$env:RUNNER_TEMP/soak" -Cycles 20 -Minutes 10
      - name: Release files
        shell: pwsh
        run: Get-ChildItem "$env:RUNNER_TEMP/release" -File | ForEach-Object { "{0,-45} {1,8:N0} MB" -f $_.Name, ($_.Length / 1MB) }
      - uses: actions/upload-artifact@v4
        with:
          name: aperture-${{ matrix.platform }}
          path: |
            ${{ runner.temp }}/release/*.exe
            ${{ runner.temp }}/release/*.zip
            ${{ runner.temp }}/release/SHA256SUMS-*.txt
          retention-days: 14
          compression-level: 0

  visual-review:
    name: Visual review screenshots
    needs: test-media
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Set the display to 1920x1080
        shell: powershell
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Build WinUI app
        run: dotnet build src/Aperture.App/Aperture.App.csproj -c Release -p:Platform=x64
      - uses: actions/download-artifact@v4
        with:
          name: test-media
          path: ${{ runner.temp }}/test-media
      - name: Drive the app and capture each state
        shell: powershell
        run: >
          tools/visual-review/Capture-States.ps1
          -Exe src/Aperture.App/bin/x64/Release/net10.0-windows10.0.22621.0/win-x64/Aperture.exe
          -MediaDir "$env:RUNNER_TEMP/test-media"
          -OutDir "$env:RUNNER_TEMP/visual-review"
      - name: Show notes and log
        if: always()
        shell: pwsh
        run: |
          Get-Content "$env:RUNNER_TEMP/visual-review/notes.txt" -ErrorAction SilentlyContinue
          Write-Host '--- aperture.log'
          Get-Content "$env:RUNNER_TEMP/visual-review/aperture.log" -ErrorAction SilentlyContinue
          Write-Host '--- server.log'
          Get-Content "$env:RUNNER_TEMP/visual-review/server.log" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-review
          path: |
            ${{ runner.temp }}/visual-review/*.png
            ${{ runner.temp }}/visual-review/*.txt
            ${{ runner.temp }}/visual-review/*.log
          retention-days: 14
      # Reviewers without access to Actions artifacts read the screenshots from this branch.
      # It holds one commit (replaced each run) of downscaled JPEGs and is never merged.
      - name: Publish screenshots to the ci/visual-review branch
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          $source = "$env:RUNNER_TEMP/visual-review"
          if (-not (Get-ChildItem "$source/*.png" -ErrorAction SilentlyContinue)) { Write-Host "No screenshots to publish."; exit 0 }
          $target = "$env:RUNNER_TEMP/visual-review-branch"
          New-Item -ItemType Directory -Force $target | Out-Null
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object { $_.MimeType -eq 'image/jpeg' }
          $quality = New-Object System.Drawing.Imaging.EncoderParameters 1
          $quality.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 82L
          Get-ChildItem "$source/*.png" | ForEach-Object {
            $image = [System.Drawing.Image]::FromFile($_.FullName)
            $width = [Math]::Min(1280, $image.Width); $height = [int]($image.Height * $width / $image.Width)
            $small = New-Object System.Drawing.Bitmap $image, $width, $height
            $small.Save((Join-Path $target ($_.BaseName + '.jpg')), $codec, $quality)
            $small.Dispose(); $image.Dispose()
          }
          Copy-Item "$source/notes.txt" $target -ErrorAction SilentlyContinue
          Set-Content "$target/README.md" "Screenshots from CI run ${{ github.run_id }} of ${{ github.sha }} on ${{ github.ref_name }}. Replaced on every run; not for merging."
          Set-Location $target
          git init -q -b ci/visual-review
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Visual review screenshots for ${{ github.sha }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ci/visual-review
