name: Probe runner (temporary)
on: [push]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - shell: powershell
        run: |
          Get-CimInstance Win32_OperatingSystem | Select Caption, Version | Format-List
          Get-CimInstance Win32_VideoController | Select Name, CurrentHorizontalResolution, CurrentVerticalResolution | Format-List
          Get-Command Set-DisplayResolution -ErrorAction SilentlyContinue | Format-List
          Get-WindowsFeature *Media* | Format-Table -AutoSize
          foreach ($d in 'mfplat.dll','msmpeg2vdec.dll','mfmp4srcsnk.dll','MSAudDecMFT.dll','mfmkvsrcsnk.dll') { "$d exists: $(Test-Path C:\Windows\System32\$d)" }
          $r = Install-WindowsFeature Server-Media-Foundation
          $r | Format-List
          foreach ($d in 'mfplat.dll','msmpeg2vdec.dll','mfmp4srcsnk.dll','MSAudDecMFT.dll','mfmkvsrcsnk.dll') { "$d exists after: $(Test-Path C:\Windows\System32\$d)" }
          try { Set-DisplayResolution -Width 1920 -Height 1080 -Force; "set ok" } catch { "set failed: $_" }
          Get-CimInstance Win32_VideoController | Select CurrentHorizontalResolution, CurrentVerticalResolution | Format-List
          where.exe ffmpeg
          [System.Environment]::UserInteractive
